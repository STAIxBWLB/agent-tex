name: Image
# Builds the environment image natively on amd64 and arm64, runs every fixture inside it under the runtime
# isolation flags, and on an `image-v<tag>` tag publishes exactly the tested images as one multi-arch tag.
# The pin job fails when src/image.ts and the registry disagree (issue #2 AC4).
on:
  pull_request:
    paths: [image/**, src/image.ts, .github/workflows/image.yml]
  push:
    branches: [main]
    paths: [image/**, src/image.ts, .github/workflows/image.yml]
    tags: [image-v*]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  REPO: ghcr.io/staixbwlb/agent-tex
jobs:
  build:
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Free disk space for the scheme-full image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build --pull -t atex:test image
      - name: TeX Live year matches the pinned tag
        run: |
          tag=$(bun -e 'import { IMAGE } from "./src/image.ts"; console.log(IMAGE.tag)')
          docker run --rm --network none atex:test tex --version | head -1 | tee /dev/stderr | grep -q "TeX Live ${tag%%.*}"
      - name: Fixtures (no network, read-only root, non-root, no capabilities; font cache reuse)
        run: python3 image/test-fixtures.py atex:test
      - name: Push the tested image for this architecture
        if: startsWith(github.ref, 'refs/tags/image-v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          tag=$(bun -e 'import { IMAGE } from "./src/image.ts"; console.log(IMAGE.tag)')
          [ "${GITHUB_REF_NAME}" = "image-v${tag}" ] || { echo "tag ${GITHUB_REF_NAME} does not match IMAGE.tag ${tag} in src/image.ts"; exit 1; }
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag atex:test "$REPO:${tag}-${{ matrix.arch }}"
          docker push "$REPO:${tag}-${{ matrix.arch }}"

  publish:
    if: startsWith(github.ref, 'refs/tags/image-v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join the tested per-architecture images into one tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          tag="${GITHUB_REF_NAME#image-v}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create -t "$REPO:$tag" "$REPO:$tag-amd64" "$REPO:$tag-arm64"
          digest=$(docker buildx imagetools inspect "$REPO:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Published $REPO:$tag at $digest. Set IMAGE.digest in src/image.ts to this value." | tee -a "$GITHUB_STEP_SUMMARY"

  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: src/image.ts matches the published digest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          read -r tag pinned < <(bun -e 'import { IMAGE } from "./src/image.ts"; console.log(IMAGE.tag, IMAGE.digest || "-")')
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          published=$(docker buildx imagetools inspect "$REPO:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)
          if [ -z "$published" ] && [ "$pinned" = "-" ]; then
            echo "::notice::$REPO:$tag is not published yet and src/image.ts pins nothing"; exit 0
          fi
          [ "$published" = "$pinned" ] || { echo "::error::src/image.ts pins ${pinned} but $REPO:$tag is ${published:-not published}. Update IMAGE.digest (or IMAGE.tag) in src/image.ts."; exit 1; }
          echo "pinned digest matches $REPO:$tag"
